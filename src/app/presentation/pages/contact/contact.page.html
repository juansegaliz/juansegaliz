<div class="section-container">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-fluid-4xl font-bold text-[var(--text-primary)] mb-8 text-center">
      {{ 'contact.title' | translate }}
    </h1>

    <p class="text-fluid-lg text-[var(--text-secondary)] mb-12 text-center">
      {{ 'contact.description' | translate }}
    </p>

    <div class="space-y-6">
      <!-- Email Contact -->
      <a
        href="mailto:juansegaliz@gmail.com"
        class="card hover:shadow-lg transition-all duration-300 flex items-center gap-6 group"
      >
        <div class="w-16 h-16 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          <svg class="w-8 h-8 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div class="flex-1">
          <h3 class="text-xl font-semibold text-[var(--text-primary)] mb-1">
            {{ 'contact.emailTitle' | translate }}
          </h3>
          <p class="text-[var(--text-secondary)]">juansegaliz&#64;gmail.com</p>
        </div>
        <svg class="w-6 h-6 text-[var(--text-secondary)] group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>

      <!-- LinkedIn Contact -->
      <a
        href="https://www.linkedin.com/in/juansegaliz/"
        target="_blank"
        rel="noopener noreferrer"
        class="card hover:shadow-lg transition-all duration-300 flex items-center gap-6 group"
      >
        <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </div>
        <div class="flex-1">
          <h3 class="text-xl font-semibold text-[var(--text-primary)] mb-1">
            {{ 'contact.linkedinTitle' | translate }}
          </h3>
          <p class="text-[var(--text-secondary)]">linkedin.com/in/juansegaliz</p>
        </div>
        <svg class="w-6 h-6 text-[var(--text-secondary)] group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>
  </div>
</div>
